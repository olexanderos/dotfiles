# Config relating to the Lazygit UI
gui:
  # Nerd fonts version to use.
  # One of: '2' | '3' | empty string (default)
  # If empty, do not show icons.
  nerdFontsVersion: "3"

customCommands:
  - key: '<c-n>'
    command: 'cd "{{.SelectedWorktree.Path}}" && zsh -ic "symlink_env_files" . && direnv allow && task uv:sync'
    description: 'Symlink env files to new worktree (after creating one)'
    context: 'worktrees'
    loadingText: 'Symlinking env files...'
    output: terminal
  - key: '<c-o>'
    context: 'worktrees'
    prompts:
      - type: 'menu'
        title: 'What to open?'
        key: 'AppToOpen'
        options:
          - name: 'Ghostty'
            description: 'Open in Ghostty'
            value: 'open -na Ghostty.app --args --working-directory="{{.SelectedWorktree.Path}}"'
          - name: 'Claude'
            description: 'Open in Claude CLI'
            value: 'open -na Ghostty.app --args --working-directory="{{.SelectedWorktree.Path}}" -e zsh -ic claude'
          - name: 'Cursor'
            description: 'Open in Cursor'
            value: 'cursor "{{.SelectedWorktree.Path}}"'
    command: '{{.Form.AppToOpen}}'
    description: 'Open worktree dir'
    output: none
  - key: '<c-t>'
    command: 'open -na Ghostty.app --args --working-directory="{{.SelectedWorktree.Path}}" -e zsh -ic claude'
    description: 'Open worktree in new Ghostty window with claude'
    context: 'worktrees'
    output: none
  - key: 'n'
    context: 'localBranches'
    prompts:
      - type: 'menu'
        title: 'What kind of branch is it?'
        key: 'BranchType'
        options:
          - name: 'feature'
            description: 'a feature branch'
            value: 'feat'
          - name: 'fix'
            description: 'a hotfix branch'
            value: 'fix'
          - name: 'chore'
            description: 'a chore branch'
            value: 'chore'
          - name: 'documentation'
            description: 'a documentation branch'
            value: 'docs'
          - name: 'refactoring'
            description: 'a refactoring branch'
            value: 'refactor'
      - type: 'input'
        title: 'What is the new branch name?'
        key: 'BranchName'
        initialValue: ''
    command: "git checkout -b {{.Form.BranchType}}/{{.Form.BranchName}}"
    loadingText: 'Creating branch'

git:
  pagers:
    - pager: delta --dark --paging=never --line-numbers --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"

